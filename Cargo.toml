[workspace]
resolver = "2"
members = ["crates/idtaxa-core", "crates/idtaxa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/metagenAu/idtaxa-rs"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
rand = "0.8"
rand_xoshiro = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
needletail = { version = "0.5", default-features = false, features = ["flate2"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
redb = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1
